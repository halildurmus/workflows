name: Prepare Release Workflow

on:
  workflow_call:
    inputs:
      dart_sdk:
        required: false
        type: string
        default: stable
      dry_run:
        required: false
        type: boolean
        default: false
      flutter_channel:
        required: false
        type: string
        default: 'stable'
      flutter_version:
        required: false
        type: string
        default: ''
      update_changelog_args:
        required: false
        type: string
        default: ''
      use_flutter:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: '.'
    secrets:
      token:
        required: true

jobs:
  prepare-release:
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🎯 Setup Dart
        if: ${{ !inputs.use_flutter }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ inputs.dart_sdk }}

      - name: 🐦 Setup Flutter
        if: ${{ inputs.use_flutter }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel }}
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: |
          if [ "${{ inputs.use_flutter }}" = "true" ]; then
            flutter pub get
          else
            dart pub get
          fi

      - name: 📦 Install git-cliff
        run: |
          if ! command -v git-cliff &> /dev/null; then
            curl -L -o git-cliff.tar.gz https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-gnu.tar.gz
            sudo tar -xf git-cliff.tar.gz --strip-components=1 -C /usr/local/bin
            rm git-cliff.tar.gz
          fi
          git-cliff --version

      - name: 🔼 Bump Version
        run: |
          dart run hooks:bump_version

      - name: 🔍 Extract Package Metadata
        id: extract_package_metadata
        run: |
          name=$(grep '^name:' pubspec.yaml | head -n 1 | awk '{print $2}')
          version=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')

          echo "📦 Package: $name"
          echo "🚀 Version: $version"

          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 📝 Update CHANGELOG
        run: dart run hooks:update_changelog --tag ${{ steps.extract_package_metadata.outputs.name }}-v${{ steps.extract_package_metadata.outputs.version }} ${{ inputs.update_changelog_args }}

      - name: 📜 Commit Changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Halil Durmus"
          git config user.email "durmushalil@proton.me"
          git add CHANGELOG.md pubspec.yaml
          git commit -m "chore(release): `package:${{ steps.extract_package_metadata.outputs.name }}` v${{ steps.extract_package_metadata.outputs.version }}"

      - name: 🚀 Create Release Pull Request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.token }}
          commit-message: 'chore(release): `package:${{ steps.extract_package_metadata.outputs.name }}` v${{ steps.extract_package_metadata.outputs.version }}'
          branch: release-${{ steps.extract_package_metadata.outputs.name }}-v${{ steps.extract_package_metadata.outputs.version }}
          title: 'chore(release): `package:${{ steps.extract_package_metadata.outputs.name }}` v${{ steps.extract_package_metadata.outputs.version }}'
          body: This PR prepares the release of `package:${{ steps.extract_package_metadata.outputs.name }}` **v${{ steps.extract_package_metadata.outputs.version }}**.
          labels: release
